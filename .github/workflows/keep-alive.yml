name: keep-alive-supabase
# Mantém o projeto Supabase (FREE) ativo, evitando a pausa por inatividade.

on:
  schedule:
    - cron: '17 12 * * *'   # todo dia ~09:17 (horário de Brasília)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no Supabase (REST)
        run: |
          echo "Pingando o banco em $(date -u)"
          curl -sS -o /dev/null -w "HTTP %{http_code} | tempo %{time_total}s\n" \
            "https://awfrygolzrygahtmwqmo.supabase.co/rest/v1/nf_entradas?select=id&limit=1" \
            -H "apikey: sb_publishable_SKnr9ZL7ASZ77--PYmrflA_C9miRsmO" \
            -H "Authorization: Bearer sb_publishable_SKnr9ZL7ASZ77--PYmrflA_C9miRsmO"
